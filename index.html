<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="나의 웹 명함" />
  <meta name="theme-color" content="#f6f6f3" />
  <title>MY NAME | Web Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card" aria-label="디지털 명함">
      <header class="card-header">
        <div class="brand-mark" aria-label="brand mark">DB</div>
        <span class="eyebrow">DIGITAL BUSINESS CARD</span>
      </header>

      <section class="hero">
        <p class="hello">Hello, I’m</p>
        <h1>MY NAME</h1>
        <p class="role">Marketing Designer</p>
        <p class="company">BMKG</p>
        <p class="intro">
          브랜드의 분위기를 정리하고,<br />
          보기 좋은 결과물로 연결합니다.
        </p>
      </section>

      <section class="actions" aria-label="연락처 바로가기">
        <a class="action primary" href="tel:01000000000">
          <span>전화하기</span>
          <span class="arrow">↗</span>
        </a>
        <a class="action" href="mailto:hello@example.com">
          <span>이메일</span>
          <span class="arrow">↗</span>
        </a>
        <a class="action" href="https://open.kakao.com/" target="_blank" rel="noopener noreferrer">
          <span>카카오톡</span>
          <span class="arrow">↗</span>
        </a>
        <a class="action" href="https://instagram.com/" target="_blank" rel="noopener noreferrer">
          <span>Instagram</span>
          <span class="arrow">↗</span>
        </a>
      </section>

      <section class="details" aria-label="상세 연락처">
        <div class="detail-row">
          <span class="label">MOBILE</span>
          <a href="tel:01000000000">010-0000-0000</a>
        </div>
        <div class="detail-row">
          <span class="label">EMAIL</span>
          <a href="mailto:hello@example.com">hello@example.com</a>
        </div>
        <div class="detail-row">
          <span class="label">WEB</span>
          <a href="#">your-domain.com</a>
        </div>
      </section>

      <footer>
        <span>© 2026 MY NAME</span>
        <span>SEOUL · KOREA</span>
      </footer>
    </section>
  </main>
</body>
</html>
